<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ôn thi Miễn dịch – Sinh lý bệnh</title>
<style>
:root{
  /* Layout: one centered column, sticky header with exam tabs + progress, question cards, navigator grid at bottom */
  --bg:#f5f7f6; --surface:#ffffff; --fg:#17211e; --muted:#5d6b66; --line:#d9e0dd;
  --accent:#0f766e; --accent-soft:#d8efec; --ok:#15803d; --ok-soft:#dcf3e3; --bad:#b91c1c; --bad-soft:#fbe0e0;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#17201d; --fg:#e6efeb; --muted:#97a8a1; --line:#2a3733;
  --accent:#4fd1c5; --accent-soft:#16332f; --ok:#5ee08a; --ok-soft:#14301f; --bad:#ff8a8a; --bad-soft:#3a1b1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#17201d; --fg:#e6efeb; --muted:#97a8a1; --line:#2a3733;
  --accent:#4fd1c5; --accent-soft:#16332f; --ok:#5ee08a; --ok-soft:#14301f; --bad:#ff8a8a; --bad-soft:#3a1b1b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;padding-inline:16px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:1.05rem;margin:0 0 8px;font-weight:700;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:.9rem;padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.stat{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px;scroll-margin-top:130px}
.q h2{font-size:1rem;font-weight:600;margin:0 0 12px;display:flex;gap:10px}
.q h2 .n{font-family:var(--font-mono);color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem;padding:10px 12px;border-radius:8px;cursor:pointer;min-width:0}
.opt .l{font-family:var(--font-mono);font-weight:700;flex:none;width:1.4em;color:var(--muted)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.ok .l{color:var(--ok)} .opt.bad .l{color:var(--bad)}
.opt:disabled{cursor:default;color:var(--fg)}
.note{font-size:.85rem;margin-top:10px;color:var(--muted)}
.note b{color:var(--ok)}
.nav{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.nav h3{margin:0 0 10px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid a{display:flex;align-items:center;justify-content:center;height:40px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-mono);font-size:.85rem;color:var(--fg);text-decoration:none;background:var(--bg);cursor:pointer;font-variant-numeric:tabular-nums}
.grid a.done{background:var(--accent-soft);border-color:var(--accent)}
.grid a.ok{background:var(--ok-soft);border-color:var(--ok)}
.grid a.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.9rem;padding:9px 16px;border-radius:8px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.result{display:none;margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.result.show{display:block}
.result strong{font-family:var(--font-mono);font-size:1.3rem}
.why{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);color:var(--fg);font-size:.9rem}
.retrybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 12px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
</style>
<div class="wrap">
<header>
  <h1>Ôn thi Miễn dịch – Sinh lý bệnh</h1>
  <div class="row">
    <div class="seg" role="group" aria-label="Chọn đề">
      <button id="e1" aria-pressed="true">Đề 1</button><button id="e2" aria-pressed="false">Đề 2</button>
    </div>
    <div class="seg" role="group" aria-label="Chế độ">
      <button id="m1" aria-pressed="true">Luyện tập</button><button id="m2" aria-pressed="false">Thi thử</button>
    </div>
    <span class="spacer"></span>
    <span class="stat" id="stat">0/60</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>
<p class="hint" id="hint"></p>
<p class="hint" id="saved" aria-live="polite"></p>
<div class="retrybar" id="retrybar" hidden><span id="retrytxt"></span><button class="btn" id="back" type="button">Về đề đầy đủ</button></div>
<div id="list"></div>
<div class="nav">
  <h3>Danh sách câu</h3>
  <div class="grid" id="grid"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" id="submit">Nộp bài</button>
    <button class="btn" id="retry">Làm lại câu sai</button>
    <button class="btn" id="reset">Làm lại</button>
    <button class="btn" id="shuf">Xáo trộn câu</button>
  </div>
  <div class="result" id="result" aria-live="polite"></div>
</div>
</div>
<script>
const DATA={"1": [{"q": "Tán huyết do tai biến truyền máu sai nhóm là quá mẫn loại mấy?", "o": ["Type I", "Type II", "Type III", "Type IV"], "a": 1, "e": "Truyền nhầm nhóm máu: kháng thể có sẵn gắn kháng nguyên trên hồng cầu, hoạt hóa bổ thể gây tán huyết. Đây là quá mẫn type II (độc tế bào qua kháng thể)."}, {"q": "Nồng độ natri máu bình thường?", "o": ["120 – 130 mmol/L", "135 – 145 mmol/L", "3 – 6 mmol/L", "3,5 – 5 mmol/L"], "a": 1, "e": "Natri máu bình thường 135–145 mmol/L. Kali máu là 3,5–5 mmol/L."}, {"q": "Bệnh nhân xơ gan, nội soi thấy giãn tĩnh mạch thực quản. Cơ chế liên quan tăng áp lực tĩnh mạch cửa là gì?", "o": ["Ứ máu tĩnh mạch cửa, hình thành tuần hoàn bàng hệ cửa – chủ ở thực quản", "Giảm áp lực tĩnh mạch cửa", "Tăng tổng hợp albumin", "Co mạch tạng"], "a": 0, "e": "Xơ gan gây tăng áp lực tĩnh mạch cửa, máu ứ lại và đi theo tuần hoàn bàng hệ cửa – chủ đến tĩnh mạch thực quản, làm các tĩnh mạch này giãn và dễ vỡ."}, {"q": "Phát biểu nào sau đây SAI về bệnh?", "o": ["Bệnh do thế lực siêu hình gây ra", "Bệnh là một trạng thái cân bằng mới kém ổn định", "Bệnh có nguyên nhân và điều kiện gây bệnh", "Bệnh là sự thay đổi cấu trúc và chức năng của cơ thể"], "a": 0, "e": "Bệnh là quá trình do nguyên nhân tự nhiên, có thể giải thích bằng khoa học. Thuyết do thế lực siêu hình là quan điểm duy tâm, không đúng."}, {"q": "Sản phẩm của đáp ứng miễn dịch không phụ thuộc tuyến ức (kháng nguyên T-độc lập) là?", "o": ["IgM", "IgG", "IgA", "IgD"], "a": 0, "e": "Kháng nguyên không phụ thuộc tuyến ức (như polysaccharide) kích thích trực tiếp lympho B mà không cần Th, chủ yếu tạo IgM, không chuyển lớp, không có tế bào nhớ."}, {"q": "Khát nước do cơ chế nào gây ra?", "o": ["Giảm áp suất thẩm thấu huyết tương", "Tăng áp suất thẩm thấu huyết tương", "Tăng nhạy cảm ADH", "Tăng thể tích huyết tương"], "a": 1, "e": "Tăng áp suất thẩm thấu huyết tương kích thích trung tâm khát ở vùng dưới đồi, gây khát và tăng tiết ADH."}, {"q": "Triệu chứng thần kinh do hạ natri máu là gì?", "o": ["Thiếu máu não thoáng qua", "Phù do dịch vào tế bào não", "Tăng áp suất thẩm thấu", "Tăng áp suất nội sọ do máu tụ"], "a": 1, "e": "Hạ natri máu làm giảm áp suất thẩm thấu ngoại bào, nước đi vào tế bào, gây phù tế bào não với các triệu chứng thần kinh (đau đầu, lú lẫn, co giật)."}, {"q": "Bệnh nhân xơ gan, yếu tố nào gây hạ đường huyết đột ngột?", "o": ["Giảm đáp ứng tế bào gan với insulin", "Giảm dự trữ glycogen", "Tăng tổng hợp lipid", "Tăng hoạt hóa phó giao cảm"], "a": 1, "e": "Xơ gan làm giảm dự trữ glycogen và giảm tân tạo glucose ở gan nên dễ hạ đường huyết khi đói hoặc gắng sức."}, {"q": "Tiêu chuẩn chẩn đoán thiếu máu?", "o": ["Giảm hồng cầu và/hoặc hemoglobin", "Niêm mạc nhạt và chóng mặt", "Đau đầu, buồn nôn", "Mệt mỏi, hồi hộp"], "a": 0, "e": "Thiếu máu được chẩn đoán khi lượng hồng cầu và/hoặc hemoglobin giảm dưới giá trị bình thường. Niêm nhạt, chóng mặt, đau đầu là triệu chứng chứ không phải tiêu chuẩn chẩn đoán."}, {"q": "pH = 7,25; pCO2 = 52 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 1, "e": "pH 7,25 là toan. pCO2 tăng (52) còn HCO3- bình thường (24): toan hô hấp."}, {"q": "Nồng độ hemoglobin thấp gây ảnh hưởng tới quá trình hô hấp nào?", "o": ["Vận chuyển khí, trao đổi O2 trong mô", "Vận chuyển khí, khuếch tán", "Thông khí, khuếch tán", "Khuếch tán, trao đổi O2 trong mô"], "a": 0, "e": "Hemoglobin vận chuyển O2 trong máu và giao O2 cho mô. Hb thấp làm giảm khả năng vận chuyển khí và trao đổi O2 ở mô, trong khi thông khí và khuếch tán qua phế nang vẫn bình thường."}, {"q": "Cấu trúc của insulin?", "o": ["2 chuỗi polypeptide liên kết disulfua", "2 chuỗi polypeptide liên kết hydro", "1 chuỗi polypeptide nội bào", "3 chuỗi polypeptide liên kết ion"], "a": 0, "e": "Insulin gồm 2 chuỗi polypeptide A và B nối nhau bằng cầu nối disulfua."}, {"q": "Cơ chế nào điều hòa đáp ứng miễn dịch dịch thể liên quan đến mảnh Fc?", "o": ["Ức chế sản xuất kháng thể nhờ thụ thể FcR trên lympho B", "Phong tỏa và ức chế kháng nguyên gắn vào kháng thể màng", "Trung hòa và loại bỏ kháng nguyên bằng cơ chế opsonin hóa", "Các lympho B tự chết theo chương trình sau khi sản xuất kháng thể"], "a": 0, "e": "Kháng thể IgG gắn kháng nguyên tạo phức hợp, phần Fc của nó gắn vào thụ thể FcγRIIB trên lympho B và gửi tín hiệu ức chế, làm giảm sản xuất kháng thể (điều hòa ngược âm tính). Các cơ chế khác không đặc trưng cho phần Fc."}, {"q": "Tác dụng chính của Th17?", "o": ["Hoạt hóa đại thực bào viêm", "Hoạt hóa neutrophil", "Kích thích tế bào Mast", "Kích thích lympho"], "a": 1, "e": "Th17 tiết IL-17, thu hút và hoạt hóa neutrophil, bảo vệ chống vi khuẩn và nấm ngoại bào. Hoạt hóa đại thực bào là chức năng của Th1."}, {"q": "Một người đàn ông 80 kg, lượng nước trong toàn bộ tế bào là bao nhiêu?", "o": ["48 L", "32 L", "4 L", "16 L"], "a": 1, "e": "Nước toàn cơ thể khoảng 60% cân nặng: 80 kg × 0,6 = 48 L. Trong đó 2/3 là nội bào: 48 × 2/3 = 32 L."}, {"q": "Cơ quan lympho trung ương là?", "o": ["Tủy xương", "Hạch", "Lách", "Mảng Peyer"], "a": 0, "e": "Cơ quan lympho trung ương (nơi lympho trưởng thành): tủy xương (lympho B) và tuyến ức (lympho T). Hạch, lách, mảng Peyer là cơ quan lympho ngoại vi."}, {"q": "pH = 7,33; HCO3- = 20 mmol/L; pCO2 = 40 mmHg. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 0, "e": "pH 7,33 là toan. HCO3- giảm (20 < 22) còn pCO2 bình thường (40): toan chuyển hóa."}, {"q": "Chất nào được dùng để đánh giá độ lọc cầu thận trên lâm sàng?", "o": ["Albumin", "Inulin", "Creatinin", "Insulin"], "a": 2, "e": "Creatinin được lọc tự do và bài tiết gần như ổn định nên dùng đánh giá độ lọc cầu thận trên lâm sàng. Inulin là chuẩn lý tưởng nhưng khó dùng thường quy."}, {"q": "Bệnh nhân tiêm vaccine COVID-19 lần thứ 4, xuất hiện kháng thể kháng huyết thanh và phản ứng Arthus. Đây là quá mẫn loại nào?", "o": ["Type I", "Type II", "Type III", "Type IV"], "a": 2, "e": "Phản ứng Arthus xuất hiện sau tiêm nhắc lại nhiều lần: kháng thể IgG đã nhiều gặp kháng nguyên tại chỗ, tạo phức hợp miễn dịch lắng đọng thành mạch, hoạt hóa bổ thể và thu hút neutrophil gây viêm hoại tử. Đây là quá mẫn type III (phức hợp miễn dịch)."}, {"q": "Hormone do thận sản xuất kích thích tạo hồng cầu là?", "o": ["Erythropoietin", "Renin", "Aldosterone", "Calcitriol"], "a": 0, "e": "Erythropoietin (EPO) do tế bào kẽ vỏ thận sản xuất khi thiếu O2, kích thích tủy xương tạo hồng cầu."}, {"q": "Thiếu máu nhược sắc hồng cầu nhỏ có thể gặp ở bệnh lý nào?", "o": ["Thiếu máu do bất sản tủy", "Thiếu máu thiếu sắt", "Thiếu máu xuất huyết", "Thiếu máu thiếu vitamin B12"], "a": 1, "e": "Thiếu sắt làm tổng hợp hemoglobin giảm, tạo hồng cầu nhỏ, nhược sắc. Bất sản tủy và xuất huyết thường là thiếu máu đẳng sắc, hồng cầu bình thường. Thiếu vitamin B12 gây thiếu máu hồng cầu to."}, {"q": "Đáp ứng B có sự hỗ trợ của tế bào Th, chuyển lớp kháng thể (IgM → IgG, IgA, IgE), tạo tế bào B nhớ. Kháng nguyên thuộc loại nào?", "o": ["Protein", "Hapten", "Lipid", "Carbohydrate"], "a": 0, "e": "Đáp ứng cần Th, có chuyển lớp từ IgM sang IgG/IgA/IgE và tạo tế bào B nhớ là đáp ứng phụ thuộc tuyến ức, đặc trưng của kháng nguyên protein."}, {"q": "Sinh lý bệnh KHÔNG có tính chất nào sau đây?", "o": ["Tính tổng hợp", "Tính tích hợp", "Tính thực nghiệm", "Tính duy tâm"], "a": 3, "e": "Sinh lý bệnh có tính tổng hợp, tích hợp và thực nghiệm. Tính duy tâm không phải là tính chất của môn khoa học này."}, {"q": "Nhiễm ký sinh trùng đặc trưng bởi tăng loại bạch cầu nào?", "o": ["Bạch cầu trung tính", "Bạch cầu ái toan", "Bạch cầu ái kiềm", "Bạch cầu đơn nhân"], "a": 1, "e": "Nhiễm ký sinh trùng (đặc biệt giun sán) kích thích đáp ứng Th2, IL-5 làm tăng bạch cầu ái toan. Bạch cầu trung tính tăng ở nhiễm khuẩn."}, {"q": "Đột biến gen CD40 ảnh hưởng trực tiếp đến quá trình nào?", "o": ["Trình diện kháng nguyên của lympho B", "Hoạt hóa lympho B phụ thuộc tuyến ức", "Hoạt hóa độc tế bào của lympho B", "Chọn lọc âm tính ở tuyến ức"], "a": 1, "e": "CD40 trên lympho B gắn CD40L của Th. Đột biến CD40 làm mất hoạt hóa lympho B phụ thuộc tuyến ức, gây thiếu hụt chuyển lớp (hội chứng tăng IgM)."}, {"q": "Xét nghiệm nào xác định bệnh nhân bị viêm da tiếp xúc?", "o": ["Test lẩy da", "Test áp da", "Xét nghiệm IgE huyết thanh toàn phần", "Xét nghiệm IgE đặc hiệu"], "a": 1, "e": "Viêm da tiếp xúc là quá mẫn type IV (muộn, qua T). Test áp da (patch test) đặt chất nghi ngờ lên da 48–72 giờ rồi đọc kết quả. Test lẩy da và IgE dùng cho quá mẫn type I."}, {"q": "Vì sao bệnh nhân tiểu đường chậm lành vết thương? (ngoại trừ)", "o": ["Tự miễn", "Môi trường đường huyết cao thuận lợi cho vi khuẩn phát triển", "Giảm khả năng thực bào của bạch cầu đa nhân", "Cơ địa dễ nhiễm khuẩn"], "a": 0, "e": "Tự miễn không phải cơ chế chủ yếu làm chậm lành vết thương ở ĐTĐ. Nguyên nhân thật sự: đường huyết cao thuận lợi cho vi khuẩn phát triển, giảm khả năng thực bào của bạch cầu đa nhân và cơ địa dễ nhiễm khuẩn."}, {"q": "Quá trình chọn lọc clone diễn ra khi lympho trưởng thành tương tác với yếu tố nào?", "o": ["Cytokine", "Kháng nguyên đặc hiệu", "Tế bào trình diện kháng nguyên", "Yếu tố hóa hướng động"], "a": 1, "e": "Chọn lọc clone: chỉ những lympho có thụ thể đặc hiệu gặp đúng kháng nguyên mới được chọn để tăng sinh và biệt hóa thành tế bào hiệu quả và tế bào nhớ."}, {"q": "Tỷ lệ % lipid trong chylomicron (theo thứ tự triglyceride : cholesterol : phospholipid)?", "o": ["95 : 2 : 3", "50 : 25 : 25", "25 : 25 : 50", "10 : 45 : 45"], "a": 0, "e": "Chylomicron vận chuyển lipid từ thức ăn nên chủ yếu là triglyceride (khoảng 90–95%), cholesterol và phospholipid chiếm phần rất nhỏ. Tỷ lệ 95 : 2 : 3 thể hiện đúng điều này."}, {"q": "pH = 7,30; pCO2 = 50 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 1, "e": "pH < 7,35 là toan. pCO2 tăng (50 > 45) trong khi HCO3- bình thường (24), nên nguyên nhân là ứ CO2: toan hô hấp."}, {"q": "Hệ đệm bicarbonat trung hòa base mạnh bằng cách nào?", "o": ["Tạo ra base yếu", "Tạo ra acid yếu", "Tạo muối base", "Tạo muối trung tính"], "a": 0, "e": "Khi gặp base mạnh (ví dụ NaOH), H2CO3 của hệ đệm bicarbonat phản ứng tạo NaHCO3 (base yếu) và nước. Nhờ vậy base mạnh được thay bằng base yếu, pH ít bị thay đổi."}, {"q": "Huyết áp 150/80 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 1", "Tăng huyết áp giai đoạn 2", "Tiền tăng huyết áp", "Bình thường"], "a": 0, "e": "Tâm thu 150 nằm trong 140–159 nên thuộc THA giai đoạn 1, tâm trương 80 chỉ là bình thường. Lấy chỉ số cao hơn để phân loại."}, {"q": "Bản chất của kháng thể là gì?", "o": ["Globulin", "Glycoprotein", "Albumin", "Lipoprotein"], "a": 1, "e": "Kháng thể là immunoglobulin, bản chất là glycoprotein (chuỗi polypeptide gắn thêm carbohydrate), thuộc phân đoạn gamma globulin trong huyết thanh. Nói \"globulin\" chỉ là vị trí điện di, bản chất hóa học chính xác là glycoprotein."}, {"q": "Bệnh nhân nghiện rượu bị loét dạ dày, đau vùng thượng vị. Cơ chế?", "o": ["Mất cân bằng giữa yếu tố tấn công và bảo vệ", "Tăng hệ đệm bicarbonat và tiết nhầy bảo vệ niêm mạc", "Tăng tái tạo tế bào do prostaglandin và TGF", "Tăng tưới máu dưới niêm"], "a": 0, "e": "Loét dạ dày do mất cân bằng giữa yếu tố tấn công (HCl, pepsin, rượu) và yếu tố bảo vệ (chất nhầy, bicarbonate, prostaglandin, tưới máu niêm mạc)."}, {"q": "Yếu tố nào KHÔNG thuộc nhóm bảo vệ niêm mạc dạ dày?", "o": ["Chất nhầy, bicarbonate bảo vệ niêm mạc", "Pepsin, HCl do tế bào chính và tế bào thành tiết ra", "Mạch máu, oxy dưới niêm mạc", "Prostaglandin giúp tái tạo mô"], "a": 1, "e": "Pepsin và HCl là yếu tố tấn công, không phải yếu tố bảo vệ. Chất nhầy, bicarbonate, tưới máu và prostaglandin là yếu tố bảo vệ."}, {"q": "Thuốc ức chế lysosome (ví dụ hydroxychloroquine) ức chế bệnh tự miễn theo cơ chế nào?", "o": ["Ức chế quá trình trình diện kháng nguyên qua MHC II", "Ức chế hoạt hóa lympho T", "Ức chế sản xuất IgE", "Ức chế bổ thể"], "a": 0, "e": "Hydroxychloroquine làm tăng pH trong lysosome, ức chế enzym xử lý kháng nguyên nên cản trở quá trình trình diện kháng nguyên qua MHC lớp II."}, {"q": "Nạn nhân tai nạn chảy máu nhiều; việc truyền máu nhanh chóng giúp phòng ngừa loại suy thận cấp nào?", "o": ["Suy thận cấp tại thận", "Suy thận cấp sau thận", "Suy thận cấp trước thận", "Suy thận mạn"], "a": 2, "e": "Mất máu nhiều làm giảm thể tích tuần hoàn, giảm tưới máu thận. Truyền máu nhanh giúp phục hồi tưới máu nên phòng suy thận cấp trước thận (chức năng, do giảm tưới máu)."}, {"q": "Giảm protein máu gây phù chủ yếu do cơ chế nào?", "o": ["Giảm áp suất keo", "Tăng áp suất thủy tĩnh", "Tăng tính thấm thành mạch", "Tắc nghẽn bạch mạch"], "a": 0, "e": "Giảm protein máu (nhất là albumin) làm giảm áp suất keo huyết tương, dịch thoát ra mô kẽ nhiều hơn quay về mạch, gây phù."}, {"q": "Thành phần nào của miễn dịch bẩm sinh nhưng liên quan mật thiết với miễn dịch thích nghi?", "o": ["Tế bào Mast", "Đại thực bào", "Lympho T", "Bạch cầu trung tính"], "a": 1, "e": "Đại thực bào là tế bào của miễn dịch bẩm sinh (thực bào) nhưng còn là tế bào trình diện kháng nguyên cho lympho T, nên liên quan mật thiết với miễn dịch thích nghi."}, {"q": "Tình trạng nào sau đây làm tăng thông khí?", "o": ["Giảm PaCO2", "Giảm PaO2", "Tăng pH máu", "Tăng PaO2"], "a": 1, "e": "Thiếu O2 (giảm PaO2) kích thích thụ thể hóa học ngoại vi làm tăng thông khí. Tăng PaO2 và tăng pH máu làm giảm thông khí, còn giảm PaCO2 cũng làm giảm kích thích hô hấp."}, {"q": "Tế bào T độc (CTL) nhận diện và tiêu diệt tế bào nhiễm vi sinh vật nội bào thông qua phân tử nào?", "o": ["MHC I", "MHC II", "Thụ thể Fc", "Thụ thể bổ thể"], "a": 0, "e": "Tế bào T độc (CD8) nhận diện kháng nguyên được trình diện trên MHC lớp I, đặc biệt là vi sinh vật nội bào, rồi tiêu diệt tế bào nhiễm. MHC lớp II dành cho T CD4."}, {"q": "Tế bào Mast có đặc điểm nào sau đây?", "o": ["Có thể được hoạt hóa bởi nọc độc rắn, ong", "Giải phóng histamin gây co mạch", "Chỉ hiện diện trong lòng mạch máu", "Không liên quan đến dị ứng"], "a": 0, "e": "Tế bào Mast mang IgE, giải phóng histamin trong dị ứng, và có thể bị hoạt hóa trực tiếp bởi nọc độc rắn, ong. Histamin gây giãn mạch (không phải co mạch), tế bào Mast nằm ở mô chứ không chỉ trong lòng mạch."}, {"q": "Lưu bệnh nhân sốc phản vệ thêm 24 giờ tại bệnh viện để làm gì?", "o": ["Kiểm tra và điều trị nếu xảy ra sốc phản vệ lần 2", "Điều tra nguyên nhân gây phản vệ", "Chữa trị suy hô hấp", "Chờ kết quả test lẩy da"], "a": 0, "e": "Phản vệ có thể tái phát dạng hai pha (sốc lần 2) sau vài giờ, thường trong 24 giờ, dù triệu chứng đã hết. Vì vậy phải theo dõi để phát hiện và xử trí kịp thời."}, {"q": "Triệu chứng lâm sàng thường gặp nhất của hội chứng thận hư?", "o": ["Tăng huyết áp và giảm albumin máu", "Phù và tiểu máu đại thể", "Phù và đạm niệu > 3 g/24h", "Toan chuyển hóa"], "a": 2, "e": "Hội chứng thận hư đặc trưng bởi phù, đạm niệu > 3,5 g/24h (đề ghi > 3 g/24h), giảm albumin máu và tăng lipid máu. Tiểu máu đại thể không phải đặc trưng."}, {"q": "Cái nào KHÔNG phải là nguyên nhân của cao huyết áp do rối loạn nội tiết?", "o": ["U tuyến giáp lành tính", "U tuyến thượng thận", "Hội chứng Cushing", "Bệnh Crohn"], "a": 3, "e": "Bệnh Crohn là bệnh viêm ruột, không phải nội tiết. Các nguyên nhân nội tiết gây tăng huyết áp: u thượng thận (pheochromocytoma, cường aldosterone), hội chứng Cushing, cường giáp."}, {"q": "pH = 7,25; pCO2 = 40 mmHg; HCO3- = 18 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 0, "e": "pH < 7,35 là toan. pCO2 bình thường (40) và HCO3- giảm (18 < 22) nên nguyên nhân là mất bicarbonat: toan chuyển hóa."}, {"q": "Cấu trúc nào của hệ miễn dịch bẩm sinh nhận diện PAMP và DAMP?", "o": ["PRR", "TCR", "Chemokine", "BCR"], "a": 0, "e": "PRR (pattern recognition receptor) là các thụ thể của miễn dịch bẩm sinh, nhận diện PAMP (mẫu phân tử của vi sinh vật) và DAMP (mẫu phân tử liên quan tổn thương). TCR và BCR thuộc miễn dịch thích nghi."}, {"q": "Cơ chế nào làm hoạt hóa tế bào NK để diệt tế bào nhiễm virus?", "o": ["Tế bào nhiễm giảm biểu lộ phối tử cho thụ thể hoạt hóa", "Tế bào nhiễm giảm biểu lộ MHC lớp I", "Tế bào nhiễm bị hoại tử", "Tế bào nhiễm chết theo chương trình"], "a": 1, "e": "Tế bào NK nhận diện \"mất bản thân\": tế bào nhiễm virus giảm biểu lộ MHC lớp I nên không còn tín hiệu ức chế (qua KIR), NK được hoạt hóa và diệt tế bào đó. Phối tử cho thụ thể hoạt hóa thì tăng, không giảm."}, {"q": "Trong giai đoạn chọn lọc âm tính ở tuyến ức, lympho T nào bị loại trừ?", "o": ["Nhận tín hiệu từ tế bào trình diện kháng nguyên", "Nhận diện kháng nguyên lạ trình diện trên HLA của bản thân", "Nhận diện kháng nguyên bản thân trình diện trên HLA của bản thân", "Nhận diện HLA của bản thân"], "a": 2, "e": "Chọn lọc âm tính ở tuyến ức loại bỏ các tế bào T nhận diện kháng nguyên của bản thân (tự kháng nguyên) trình diện trên HLA của bản thân, nhằm tránh tự miễn. Tế bào T nhận diện HLA của bản thân với ái lực vừa phải thì được giữ lại ở bước chọn lọc dương tính."}, {"q": "Huyết áp 152/95 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 1", "Tăng huyết áp giai đoạn 2", "Tiền tăng huyết áp", "Bình thường"], "a": 0, "e": "Phân loại huyết áp (theo thang dùng trong đề): THA giai đoạn 1 khi tâm thu 140–159 hoặc tâm trương 90–99. 152/95 nằm trong khoảng này."}, {"q": "Biến chứng của suy giảm chức năng thận là gì?", "o": ["Giảm ure máu", "Thiếu máu", "Tụt huyết áp", "Tăng sản tủy xương"], "a": 1, "e": "Suy thận giảm sản xuất erythropoietin nên gây thiếu máu. Ure máu tăng (không giảm), huyết áp thường tăng và tủy xương bị giảm sản."}, {"q": "Một người đàn ông sụt cân, có anh trai bị ĐTĐ type 2. Tiêu chuẩn nào xác định người này bị ĐTĐ?", "o": ["Đường huyết ngay sau ăn 140 mg/dL", "HbA1c 4%", "Đường huyết đói 140 mg/dL", "Đường niệu dương tính"], "a": 2, "e": "Tiêu chuẩn chẩn đoán ĐTĐ: đường huyết đói ≥ 126 mg/dL (7,0 mmol/L), hoặc đường huyết bất kỳ ≥ 200 mg/dL có triệu chứng, hoặc HbA1c ≥ 6,5%. Đường huyết đói 140 mg/dL vượt ngưỡng. Sau ăn 140 và HbA1c 4% đều bình thường, đường niệu dương tính không đủ để chẩn đoán."}, {"q": "Bệnh nhân dị ứng mạt bụi nhà, thuốc điều trị nào phù hợp?", "o": ["Kháng thể kháng IgE (Omalizumab)", "Kháng thể kháng TNF-alpha", "Kháng IL-1", "Kháng IL-17"], "a": 0, "e": "Dị ứng mạt bụi nhà là quá mẫn type I do IgE. Omalizumab là kháng thể đơn dòng kháng IgE, giảm IgE tự do và hạn chế hoạt hóa tế bào Mast."}, {"q": "Trong xơ vữa động mạch, lipoprotein nào có giá trị tiên lượng giảm nguy cơ?", "o": ["Giảm LDL hơn so với mức bình thường", "Tăng HDL hơn so với mức bình thường", "Giảm HDL", "Tăng chylomicron"], "a": 1, "e": "HDL vận chuyển cholesterol từ mô về gan (vận chuyển ngược), có tác dụng bảo vệ chống xơ vữa nên tăng HDL làm giảm nguy cơ. LDL cao hay chylomicron tăng, HDL thấp đều tăng nguy cơ."}, {"q": "Lý do nào giúp tiêm chủng đậu bò phòng được bệnh đậu mùa?", "o": ["Phản ứng chéo kháng nguyên giữa hai loại virus", "Tình trạng dung nạp miễn dịch", "Kháng nguyên của hai loại hoàn toàn giống nhau", "Tạo miễn dịch không đặc hiệu"], "a": 0, "e": "Vaccine đậu bò (cowpox) phòng đậu mùa nhờ phản ứng chéo: hai virus có kháng nguyên giống nhau một phần nên miễn dịch chống virus này bảo vệ chống virus kia. Hai loại không hoàn toàn giống nhau."}, {"q": "Công thức immunoglobulin nào sau đây đúng?", "o": ["IgE – λ2ε2", "IgG – κ2δ2", "IgM – λ2μμ", "IgA – λ2κ2"], "a": 0, "e": "Công thức đúng: IgE gồm 2 chuỗi nhẹ (κ hoặc λ) và 2 chuỗi nặng ε (λ2ε2). IgG là γ, IgM là μ, IgA là α, không phải δ hay các kiểu ghi trong phương án sai."}, {"q": "Bản chất cơ chế biểu hiện lâm sàng của suy tim trái là gì?", "o": ["Thiếu máu nuôi tim", "Ứ máu ở phổi", "Giảm thông khí phổi", "Ứ máu ngoại vi"], "a": 1, "e": "Suy tim trái làm tâm thất trái không bơm đủ máu, máu ứ lại ở tuần hoàn phổi gây ứ máu phổi (khó thở, ho, ran ẩm). Ứ máu ngoại vi là biểu hiện của suy tim phải."}, {"q": "Bệnh Thalassemia là bệnh lý do rối loạn gì?", "o": ["Bất thường hemoglobin", "Khiếm khuyết màng hồng cầu", "Thiếu men bẩm sinh", "Bất thường tiểu cầu"], "a": 0, "e": "Thalassemia là bệnh di truyền do rối loạn tổng hợp chuỗi globin, tức bất thường hemoglobin (giảm hoặc không tổng hợp chuỗi α hoặc β)."}, {"q": "Trong nhiễm cấp với vi sinh vật gây bệnh, kháng thể loại nào tăng cao trong máu?", "o": ["IgE", "IgM", "IgG", "IgD"], "a": 1, "e": "Trong nhiễm cấp, IgM xuất hiện đầu tiên và tăng cao. IgG tăng muộn hơn, báo hiệu giai đoạn muộn hoặc đáp ứng nhớ."}, {"q": "Tổn thương xảy ra ở màng mao mạch – phế nang ảnh hưởng chủ yếu đến quá trình nào?", "o": ["Thông khí", "Khuếch tán", "Vận chuyển khí trong máu", "Trao đổi khí ở mô"], "a": 1, "e": "Trao đổi khí O2 và CO2 giữa phế nang và máu mao mạch diễn ra qua màng phế nang – mao mạch bằng khuếch tán. Tổn thương màng này gây rối loạn khuếch tán."}], "2": [{"q": "Cấu trúc nào của hệ miễn dịch bẩm sinh nhận diện PAMP và DAMP?", "o": ["TCR", "BCR", "Chemokine", "PRR"], "a": 3, "e": "PRR (pattern recognition receptor) là các thụ thể của miễn dịch bẩm sinh, nhận diện PAMP (mẫu phân tử của vi sinh vật) và DAMP (mẫu phân tử liên quan tổn thương). TCR và BCR thuộc miễn dịch thích nghi."}, {"q": "Thành phần nào của miễn dịch bẩm sinh nhưng liên quan mật thiết với miễn dịch thích nghi?", "o": ["Bạch cầu trung tính", "Tế bào Mast", "Đại thực bào", "Lympho T"], "a": 2, "e": "Đại thực bào là tế bào của miễn dịch bẩm sinh (thực bào) nhưng còn là tế bào trình diện kháng nguyên cho lympho T, nên liên quan mật thiết với miễn dịch thích nghi."}, {"q": "Công thức immunoglobulin nào sau đây đúng?", "o": ["IgE – λ2ε2", "IgG – κ2δ2", "IgM – λ2μμ", "IgA – λ2κ2"], "a": 0, "e": "Công thức đúng: IgE gồm 2 chuỗi nhẹ (κ hoặc λ) và 2 chuỗi nặng ε (λ2ε2). IgG là γ, IgM là μ, IgA là α, không phải δ hay các kiểu ghi trong phương án sai."}, {"q": "Bản chất của kháng thể là gì?", "o": ["Globulin", "Glycoprotein", "Lipoprotein", "Albumin"], "a": 1, "e": "Kháng thể là immunoglobulin, bản chất là glycoprotein (chuỗi polypeptide gắn thêm carbohydrate), thuộc phân đoạn gamma globulin trong huyết thanh. Nói \"globulin\" chỉ là vị trí điện di, bản chất hóa học chính xác là glycoprotein."}, {"q": "Thuốc ức chế lysosome (ví dụ hydroxychloroquine) ức chế bệnh tự miễn theo cơ chế nào?", "o": ["Ức chế hoạt hóa lympho T", "Ức chế quá trình trình diện kháng nguyên qua MHC II", "Ức chế sản xuất IgE", "Ức chế bổ thể"], "a": 1, "e": "Hydroxychloroquine làm tăng pH trong lysosome, ức chế enzym xử lý kháng nguyên nên cản trở quá trình trình diện kháng nguyên qua MHC lớp II."}, {"q": "Thành phần nào sau đây thuộc hàng rào cơ học của miễn dịch bẩm sinh?", "o": ["Vi khuẩn cộng sinh", "Lysozyme trong nước mắt", "Nhu động ruột", "pH thấp"], "a": 2, "e": "Nhu động ruột là yếu tố cơ học cuốn trôi vi sinh vật. Vi khuẩn cộng sinh thuộc hàng rào sinh học, lysozyme thuộc hàng rào hóa học, pH thấp cũng là hàng rào hóa học."}, {"q": "pH = 7,33; HCO3- = 20 mmol/L; pCO2 = 40 mmHg. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Kiềm hô hấp", "Kiềm chuyển hóa", "Toan hô hấp"], "a": 0, "e": "pH 7,33 là toan. HCO3- giảm (20 < 22) còn pCO2 bình thường (40): toan chuyển hóa."}, {"q": "Thiếu máu nhược sắc hồng cầu nhỏ có thể gặp ở bệnh lý nào?", "o": ["Thiếu máu xuất huyết", "Thiếu máu thiếu vitamin B12", "Thiếu máu thiếu sắt", "Thiếu máu do bất sản tủy"], "a": 2, "e": "Thiếu sắt làm tổng hợp hemoglobin giảm, tạo hồng cầu nhỏ, nhược sắc. Bất sản tủy và xuất huyết thường là thiếu máu đẳng sắc, hồng cầu bình thường. Thiếu vitamin B12 gây thiếu máu hồng cầu to."}, {"q": "Thiếu máu tán huyết có đặc điểm nào sau đây?", "o": ["Thể tích máu giảm", "Sắt huyết thanh giảm", "Hồng cầu lưới giảm", "Bilirubin tự do tăng"], "a": 3, "e": "Tán huyết làm hồng cầu vỡ, giải phóng hemoglobin chuyển thành bilirubin tự do nên bilirubin tự do tăng. Hồng cầu lưới tăng (tủy bù trừ), sắt huyết thanh thường tăng chứ không giảm."}, {"q": "Cái nào KHÔNG phải là nguyên nhân của cao huyết áp do rối loạn nội tiết?", "o": ["Bệnh Crohn", "U tuyến thượng thận", "Hội chứng Cushing", "U tuyến giáp lành tính"], "a": 0, "e": "Bệnh Crohn là bệnh viêm ruột, không phải nội tiết. Các nguyên nhân nội tiết gây tăng huyết áp: u thượng thận (pheochromocytoma, cường aldosterone), hội chứng Cushing, cường giáp."}, {"q": "Khát nước do cơ chế nào gây ra?", "o": ["Tăng thể tích huyết tương", "Giảm áp suất thẩm thấu huyết tương", "Tăng áp suất thẩm thấu huyết tương", "Tăng nhạy cảm ADH"], "a": 2, "e": "Tăng áp suất thẩm thấu huyết tương kích thích trung tâm khát ở vùng dưới đồi, gây khát và tăng tiết ADH."}, {"q": "Tế bào T độc (CTL) nhận diện và tiêu diệt tế bào nhiễm vi sinh vật nội bào thông qua phân tử nào?", "o": ["MHC I", "Thụ thể Fc", "Thụ thể bổ thể", "MHC II"], "a": 0, "e": "Tế bào T độc (CD8) nhận diện kháng nguyên được trình diện trên MHC lớp I, đặc biệt là vi sinh vật nội bào, rồi tiêu diệt tế bào nhiễm. MHC lớp II dành cho T CD4."}, {"q": "Bệnh nhân nghiện rượu bị loét dạ dày, đau vùng thượng vị. Cơ chế?", "o": ["Tăng tưới máu dưới niêm", "Mất cân bằng giữa yếu tố tấn công và bảo vệ", "Tăng tái tạo tế bào do prostaglandin và TGF", "Tăng hệ đệm bicarbonat và tiết nhầy bảo vệ niêm mạc"], "a": 1, "e": "Loét dạ dày do mất cân bằng giữa yếu tố tấn công (HCl, pepsin, rượu) và yếu tố bảo vệ (chất nhầy, bicarbonate, prostaglandin, tưới máu niêm mạc)."}, {"q": "pH = 7,25; pCO2 = 52 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Kiềm hô hấp", "Kiềm chuyển hóa", "Toan hô hấp"], "a": 3, "e": "pH 7,25 là toan. pCO2 tăng (52) còn HCO3- bình thường (24): toan hô hấp."}, {"q": "Yếu tố nào sau đây ảnh hưởng chính đến huyết áp?", "o": ["Thể tích máu và độ bão hòa oxy máu", "Sức co cơ tim và thể tích thông khí phổi", "Lưu lượng tim và sức cản ngoại vi", "Sức đàn hồi và tính thấm thành mạch"], "a": 2, "e": "Huyết áp = cung lượng tim (lưu lượng tim) × sức cản ngoại vi. Hai yếu tố này quyết định chính huyết áp. Các yếu tố còn lại chỉ ảnh hưởng gián tiếp."}, {"q": "Trong nhiễm cấp với vi sinh vật gây bệnh, kháng thể loại nào tăng cao trong máu?", "o": ["IgD", "IgG", "IgE", "IgM"], "a": 3, "e": "Trong nhiễm cấp, IgM xuất hiện đầu tiên và tăng cao. IgG tăng muộn hơn, báo hiệu giai đoạn muộn hoặc đáp ứng nhớ."}, {"q": "Cơ chế ổn định huyết áp lâu dài là gì?", "o": ["Dịch ngoại bào và hệ RAA", "Tăng sức bóp cơ tim tức thời", "Co mạch ngoại vi", "Thay đổi sức cản ngoại biên cấp do thụ thể áp lực"], "a": 0, "e": "Ổn định huyết áp lâu dài nhờ điều hòa thể tích dịch ngoại bào và hệ renin–angiotensin–aldosterone (qua thận). Thụ thể áp lực và co mạch chỉ điều chỉnh nhanh, ngắn hạn."}, {"q": "Bệnh nhân 17 tuổi, đường huyết 20 mmol/L, ceton tăng, ăn nhiều, uống nhiều, tiểu nhiều, sụt cân nhiều. Cơ chế sụt cân là gì?", "o": ["Mất nước đơn thuần do tiểu nhiều", "Giảm hấp thu glucose ở ruột", "Tăng phân giải glycogen, protein, lipid khi tế bào thiếu năng lượng do không sử dụng được glucose", "Tăng tổng hợp lipid và protein"], "a": 2, "e": "Thiếu insulin tuyệt đối (ĐTĐ type 1): tế bào không dùng được glucose nên cơ thể tăng phân giải glycogen, protein, lipid để lấy năng lượng, sinh ceton và gây sụt cân nhiều."}, {"q": "Yếu tố nào KHÔNG thuộc nhóm bảo vệ niêm mạc dạ dày?", "o": ["Mạch máu, oxy dưới niêm mạc", "Prostaglandin giúp tái tạo mô", "Chất nhầy, bicarbonate bảo vệ niêm mạc", "Pepsin, HCl do tế bào chính và tế bào thành tiết ra"], "a": 3, "e": "Pepsin và HCl là yếu tố tấn công, không phải yếu tố bảo vệ. Chất nhầy, bicarbonate, tưới máu và prostaglandin là yếu tố bảo vệ."}, {"q": "Tỷ lệ % lipid trong chylomicron (theo thứ tự triglyceride : cholesterol : phospholipid)?", "o": ["95 : 2 : 3", "10 : 45 : 45", "50 : 25 : 25", "25 : 25 : 50"], "a": 0, "e": "Chylomicron vận chuyển lipid từ thức ăn nên chủ yếu là triglyceride (khoảng 90–95%), cholesterol và phospholipid chiếm phần rất nhỏ. Tỷ lệ 95 : 2 : 3 thể hiện đúng điều này."}, {"q": "Trong giai đoạn chọn lọc âm tính ở tuyến ức, lympho T nào bị loại trừ?", "o": ["Nhận diện kháng nguyên bản thân trình diện trên HLA của bản thân", "Nhận tín hiệu từ tế bào trình diện kháng nguyên", "Nhận diện kháng nguyên lạ trình diện trên HLA của bản thân", "Nhận diện HLA của bản thân"], "a": 0, "e": "Chọn lọc âm tính ở tuyến ức loại bỏ các tế bào T nhận diện kháng nguyên của bản thân (tự kháng nguyên) trình diện trên HLA của bản thân, nhằm tránh tự miễn. Tế bào T nhận diện HLA của bản thân với ái lực vừa phải thì được giữ lại ở bước chọn lọc dương tính."}, {"q": "Quá trình chọn lọc clone diễn ra khi lympho trưởng thành tương tác với yếu tố nào?", "o": ["Tế bào trình diện kháng nguyên", "Kháng nguyên đặc hiệu", "Cytokine", "Yếu tố hóa hướng động"], "a": 1, "e": "Chọn lọc clone: chỉ những lympho có thụ thể đặc hiệu gặp đúng kháng nguyên mới được chọn để tăng sinh và biệt hóa thành tế bào hiệu quả và tế bào nhớ."}, {"q": "Cấu trúc của insulin?", "o": ["1 chuỗi polypeptide nội bào", "3 chuỗi polypeptide liên kết ion", "2 chuỗi polypeptide liên kết disulfua", "2 chuỗi polypeptide liên kết hydro"], "a": 2, "e": "Insulin gồm 2 chuỗi polypeptide A và B nối nhau bằng cầu nối disulfua."}, {"q": "Cơ quan lympho trung ương là?", "o": ["Lách", "Tủy xương", "Mảng Peyer", "Hạch"], "a": 1, "e": "Cơ quan lympho trung ương (nơi lympho trưởng thành): tủy xương (lympho B) và tuyến ức (lympho T). Hạch, lách, mảng Peyer là cơ quan lympho ngoại vi."}, {"q": "Sản phẩm của đáp ứng miễn dịch không phụ thuộc tuyến ức (kháng nguyên T-độc lập) là?", "o": ["IgA", "IgM", "IgD", "IgG"], "a": 1, "e": "Kháng nguyên không phụ thuộc tuyến ức (như polysaccharide) kích thích trực tiếp lympho B mà không cần Th, chủ yếu tạo IgM, không chuyển lớp, không có tế bào nhớ."}, {"q": "Nhiễm ký sinh trùng đặc trưng bởi tăng loại bạch cầu nào?", "o": ["Bạch cầu trung tính", "Bạch cầu đơn nhân", "Bạch cầu ái kiềm", "Bạch cầu ái toan"], "a": 3, "e": "Nhiễm ký sinh trùng (đặc biệt giun sán) kích thích đáp ứng Th2, IL-5 làm tăng bạch cầu ái toan. Bạch cầu trung tính tăng ở nhiễm khuẩn."}, {"q": "Vì sao phải tiêm vaccine COVID-19 nhiều lần?", "o": ["Do kháng thể IgG tồn tại vĩnh viễn", "Do vaccine gây dung nạp miễn dịch", "Do virus biến đổi nên hiệu lực vaccine giảm", "Do vaccine chỉ kích thích miễn dịch bẩm sinh"], "a": 2, "e": "Virus SARS-CoV-2 liên tục đột biến nên kháng nguyên thay đổi, hiệu lực vaccine giảm dần, vì vậy phải tiêm nhắc lại bằng vaccine cập nhật."}, {"q": "Tác dụng chính của Th17?", "o": ["Hoạt hóa đại thực bào viêm", "Kích thích lympho", "Hoạt hóa neutrophil", "Kích thích tế bào Mast"], "a": 2, "e": "Th17 tiết IL-17, thu hút và hoạt hóa neutrophil, bảo vệ chống vi khuẩn và nấm ngoại bào. Hoạt hóa đại thực bào là chức năng của Th1."}, {"q": "Lý do nào giúp tiêm chủng đậu bò phòng được bệnh đậu mùa?", "o": ["Kháng nguyên của hai loại hoàn toàn giống nhau", "Tạo miễn dịch không đặc hiệu", "Phản ứng chéo kháng nguyên giữa hai loại virus", "Tình trạng dung nạp miễn dịch"], "a": 2, "e": "Vaccine đậu bò (cowpox) phòng đậu mùa nhờ phản ứng chéo: hai virus có kháng nguyên giống nhau một phần nên miễn dịch chống virus này bảo vệ chống virus kia. Hai loại không hoàn toàn giống nhau."}, {"q": "Bệnh nhân xơ gan, yếu tố nào gây hạ đường huyết đột ngột?", "o": ["Tăng hoạt hóa phó giao cảm", "Giảm đáp ứng tế bào gan với insulin", "Tăng tổng hợp lipid", "Giảm dự trữ glycogen"], "a": 3, "e": "Xơ gan làm giảm dự trữ glycogen và giảm tân tạo glucose ở gan nên dễ hạ đường huyết khi đói hoặc gắng sức."}, {"q": "Viêm phổi gây ứ dịch ở phế nang. Rối loạn ở giai đoạn nào gây suy hô hấp?", "o": ["Thông khí", "Trao đổi khí tại mô", "Vận chuyển khí trong máu", "Khuếch tán tại phổi"], "a": 3, "e": "Dịch ứ ở phế nang làm dày và cản trở màng trao đổi khí, gây rối loạn khuếch tán tại phổi."}, {"q": "Biến chứng của suy giảm chức năng thận là gì?", "o": ["Thiếu máu", "Tụt huyết áp", "Giảm ure máu", "Tăng sản tủy xương"], "a": 0, "e": "Suy thận giảm sản xuất erythropoietin nên gây thiếu máu. Ure máu tăng (không giảm), huyết áp thường tăng và tủy xương bị giảm sản."}, {"q": "Triệu chứng thần kinh do hạ natri máu là gì?", "o": ["Phù do dịch vào tế bào não", "Thiếu máu não thoáng qua", "Tăng áp suất nội sọ do máu tụ", "Tăng áp suất thẩm thấu"], "a": 0, "e": "Hạ natri máu làm giảm áp suất thẩm thấu ngoại bào, nước đi vào tế bào, gây phù tế bào não với các triệu chứng thần kinh (đau đầu, lú lẫn, co giật)."}, {"q": "Cơ chế nào làm hoạt hóa tế bào NK để diệt tế bào nhiễm virus?", "o": ["Tế bào nhiễm chết theo chương trình", "Tế bào nhiễm bị hoại tử", "Tế bào nhiễm giảm biểu lộ phối tử cho thụ thể hoạt hóa", "Tế bào nhiễm giảm biểu lộ MHC lớp I"], "a": 3, "e": "Tế bào NK nhận diện \"mất bản thân\": tế bào nhiễm virus giảm biểu lộ MHC lớp I nên không còn tín hiệu ức chế (qua KIR), NK được hoạt hóa và diệt tế bào đó. Phối tử cho thụ thể hoạt hóa thì tăng, không giảm."}, {"q": "Bệnh nhân dị ứng mạt bụi nhà, thuốc điều trị nào phù hợp?", "o": ["Kháng IL-1", "Kháng IL-17", "Kháng thể kháng IgE (Omalizumab)", "Kháng thể kháng TNF-alpha"], "a": 2, "e": "Dị ứng mạt bụi nhà là quá mẫn type I do IgE. Omalizumab là kháng thể đơn dòng kháng IgE, giảm IgE tự do và hạn chế hoạt hóa tế bào Mast."}, {"q": "Phát biểu nào sau đây SAI về bệnh?", "o": ["Bệnh có nguyên nhân và điều kiện gây bệnh", "Bệnh do thế lực siêu hình gây ra", "Bệnh là một trạng thái cân bằng mới kém ổn định", "Bệnh là sự thay đổi cấu trúc và chức năng của cơ thể"], "a": 1, "e": "Bệnh là quá trình do nguyên nhân tự nhiên, có thể giải thích bằng khoa học. Thuyết do thế lực siêu hình là quan điểm duy tâm, không đúng."}, {"q": "Huyết áp 152/95 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 2", "Tăng huyết áp giai đoạn 1", "Bình thường", "Tiền tăng huyết áp"], "a": 1, "e": "Phân loại huyết áp (theo thang dùng trong đề): THA giai đoạn 1 khi tâm thu 140–159 hoặc tâm trương 90–99. 152/95 nằm trong khoảng này."}, {"q": "Bệnh nhân xơ gan, nội soi thấy giãn tĩnh mạch thực quản. Cơ chế liên quan tăng áp lực tĩnh mạch cửa là gì?", "o": ["Tăng tổng hợp albumin", "Ứ máu tĩnh mạch cửa, hình thành tuần hoàn bàng hệ cửa – chủ ở thực quản", "Giảm áp lực tĩnh mạch cửa", "Co mạch tạng"], "a": 1, "e": "Xơ gan gây tăng áp lực tĩnh mạch cửa, máu ứ lại và đi theo tuần hoàn bàng hệ cửa – chủ đến tĩnh mạch thực quản, làm các tĩnh mạch này giãn và dễ vỡ."}, {"q": "Tác nhân gây tiêu chảy thẩm thấu là?", "o": ["Salmonella", "Độc tố tả", "Thiếu men lactase", "Hội chứng ruột kích thích"], "a": 2, "e": "Tiêu chảy thẩm thấu do chất tan không hấp thu giữ nước trong lòng ruột. Thiếu lactase làm lactose không tiêu hóa, giữ nước gây tiêu chảy. Độc tố tả và Salmonella gây tiêu chảy tiết dịch."}, {"q": "Em học sinh N bị tiểu đường type 2 một năm, ăn nhiều nhưng vẫn sụt cân. Lý do?", "o": ["Tăng chuyển hóa do kháng insulin lâu dài", "Thoái giáng protid và lipid để tạo năng lượng", "Tăng tổng hợp glycogen ở gan", "Giảm hấp thu thức ăn ở ruột"], "a": 1, "e": "ĐTĐ type 2 kháng insulin lâu dài: tế bào không dùng được glucose nên cơ thể thoái giáng protid và lipid để lấy năng lượng, gây sụt cân dù ăn nhiều."}, {"q": "Tình trạng nào sau đây làm tăng thông khí?", "o": ["Tăng pH máu", "Giảm PaCO2", "Tăng PaO2", "Giảm PaO2"], "a": 3, "e": "Thiếu O2 (giảm PaO2) kích thích thụ thể hóa học ngoại vi làm tăng thông khí. Tăng PaO2 và tăng pH máu làm giảm thông khí, còn giảm PaCO2 cũng làm giảm kích thích hô hấp."}, {"q": "pH = 7,25; pCO2 = 40 mmHg; HCO3- = 18 mmol/L. Rối loạn acid–base nào?", "o": ["Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp", "Toan chuyển hóa"], "a": 3, "e": "pH < 7,35 là toan. pCO2 bình thường (40) và HCO3- giảm (18 < 22) nên nguyên nhân là mất bicarbonat: toan chuyển hóa."}, {"q": "Nồng độ natri máu bình thường?", "o": ["3 – 6 mmol/L", "135 – 145 mmol/L", "120 – 130 mmol/L", "3,5 – 5 mmol/L"], "a": 1, "e": "Natri máu bình thường 135–145 mmol/L. Kali máu là 3,5–5 mmol/L."}, {"q": "Bệnh Thalassemia là bệnh lý do rối loạn gì?", "o": ["Khiếm khuyết màng hồng cầu", "Bất thường hemoglobin", "Thiếu men bẩm sinh", "Bất thường tiểu cầu"], "a": 1, "e": "Thalassemia là bệnh di truyền do rối loạn tổng hợp chuỗi globin, tức bất thường hemoglobin (giảm hoặc không tổng hợp chuỗi α hoặc β)."}, {"q": "Nồng độ hemoglobin thấp gây ảnh hưởng tới quá trình hô hấp nào?", "o": ["Vận chuyển khí, trao đổi O2 trong mô", "Thông khí, khuếch tán", "Vận chuyển khí, khuếch tán", "Khuếch tán, trao đổi O2 trong mô"], "a": 0, "e": "Hemoglobin vận chuyển O2 trong máu và giao O2 cho mô. Hb thấp làm giảm khả năng vận chuyển khí và trao đổi O2 ở mô, trong khi thông khí và khuếch tán qua phế nang vẫn bình thường."}, {"q": "pH = 7,30; pCO2 = 50 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan hô hấp", "Kiềm hô hấp", "Kiềm chuyển hóa", "Toan chuyển hóa"], "a": 0, "e": "pH < 7,35 là toan. pCO2 tăng (50 > 45) trong khi HCO3- bình thường (24), nên nguyên nhân là ứ CO2: toan hô hấp."}, {"q": "Tổn thương xảy ra ở màng mao mạch – phế nang ảnh hưởng chủ yếu đến quá trình nào?", "o": ["Khuếch tán", "Thông khí", "Trao đổi khí ở mô", "Vận chuyển khí trong máu"], "a": 0, "e": "Trao đổi khí O2 và CO2 giữa phế nang và máu mao mạch diễn ra qua màng phế nang – mao mạch bằng khuếch tán. Tổn thương màng này gây rối loạn khuếch tán."}, {"q": "Bệnh nhân khó thở, tiền sử tăng huyết áp lâu năm, ho khan về đêm, nghe ran ở hai đáy phổi. Nguyên nhân?", "o": ["Ứ máu ngoại vi do suy tim phải", "Giãn mạch ngoại vi", "Tràn dịch màng phổi do ung thư", "Ứ máu ở phổi do suy tim trái"], "a": 3, "e": "Tăng huyết áp lâu năm gây suy tim trái, máu ứ ở phổi gây khó thở, ho khan về đêm và ran ở hai đáy phổi."}, {"q": "Lưu bệnh nhân sốc phản vệ thêm 24 giờ tại bệnh viện để làm gì?", "o": ["Chờ kết quả test lẩy da", "Chữa trị suy hô hấp", "Kiểm tra và điều trị nếu xảy ra sốc phản vệ lần 2", "Điều tra nguyên nhân gây phản vệ"], "a": 2, "e": "Phản vệ có thể tái phát dạng hai pha (sốc lần 2) sau vài giờ, thường trong 24 giờ, dù triệu chứng đã hết. Vì vậy phải theo dõi để phát hiện và xử trí kịp thời."}, {"q": "Bản chất cơ chế biểu hiện lâm sàng của suy tim trái là gì?", "o": ["Giảm thông khí phổi", "Ứ máu ở phổi", "Thiếu máu nuôi tim", "Ứ máu ngoại vi"], "a": 1, "e": "Suy tim trái làm tâm thất trái không bơm đủ máu, máu ứ lại ở tuần hoàn phổi gây ứ máu phổi (khó thở, ho, ran ẩm). Ứ máu ngoại vi là biểu hiện của suy tim phải."}, {"q": "Triệu chứng lâm sàng thường gặp nhất của hội chứng thận hư?", "o": ["Tăng huyết áp và giảm albumin máu", "Phù và đạm niệu > 3 g/24h", "Toan chuyển hóa", "Phù và tiểu máu đại thể"], "a": 1, "e": "Hội chứng thận hư đặc trưng bởi phù, đạm niệu > 3,5 g/24h (đề ghi > 3 g/24h), giảm albumin máu và tăng lipid máu. Tiểu máu đại thể không phải đặc trưng."}, {"q": "Sinh lý bệnh KHÔNG có tính chất nào sau đây?", "o": ["Tính tổng hợp", "Tính duy tâm", "Tính tích hợp", "Tính thực nghiệm"], "a": 1, "e": "Sinh lý bệnh có tính tổng hợp, tích hợp và thực nghiệm. Tính duy tâm không phải là tính chất của môn khoa học này."}, {"q": "Nạn nhân tai nạn chảy máu nhiều; việc truyền máu nhanh chóng giúp phòng ngừa loại suy thận cấp nào?", "o": ["Suy thận cấp sau thận", "Suy thận cấp trước thận", "Suy thận cấp tại thận", "Suy thận mạn"], "a": 1, "e": "Mất máu nhiều làm giảm thể tích tuần hoàn, giảm tưới máu thận. Truyền máu nhanh giúp phục hồi tưới máu nên phòng suy thận cấp trước thận (chức năng, do giảm tưới máu)."}, {"q": "Tán huyết do tai biến truyền máu sai nhóm là quá mẫn loại mấy?", "o": ["Type II", "Type I", "Type III", "Type IV"], "a": 0, "e": "Truyền nhầm nhóm máu: kháng thể có sẵn gắn kháng nguyên trên hồng cầu, hoạt hóa bổ thể gây tán huyết. Đây là quá mẫn type II (độc tế bào qua kháng thể)."}, {"q": "Vì sao bệnh nhân tiểu đường chậm lành vết thương? (ngoại trừ)", "o": ["Môi trường đường huyết cao thuận lợi cho vi khuẩn phát triển", "Giảm khả năng thực bào của bạch cầu đa nhân", "Tự miễn", "Cơ địa dễ nhiễm khuẩn"], "a": 2, "e": "Tự miễn không phải cơ chế chủ yếu làm chậm lành vết thương ở ĐTĐ. Nguyên nhân thật sự: đường huyết cao thuận lợi cho vi khuẩn phát triển, giảm khả năng thực bào của bạch cầu đa nhân và cơ địa dễ nhiễm khuẩn."}, {"q": "Huyết áp 150/80 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 1", "Bình thường", "Tăng huyết áp giai đoạn 2", "Tiền tăng huyết áp"], "a": 0, "e": "Tâm thu 150 nằm trong 140–159 nên thuộc THA giai đoạn 1, tâm trương 80 chỉ là bình thường. Lấy chỉ số cao hơn để phân loại."}, {"q": "Một người đàn ông sụt cân, có anh trai bị ĐTĐ type 2. Tiêu chuẩn nào xác định người này bị ĐTĐ?", "o": ["HbA1c 4%", "Đường niệu dương tính", "Đường huyết đói 140 mg/dL", "Đường huyết ngay sau ăn 140 mg/dL"], "a": 2, "e": "Tiêu chuẩn chẩn đoán ĐTĐ: đường huyết đói ≥ 126 mg/dL (7,0 mmol/L), hoặc đường huyết bất kỳ ≥ 200 mg/dL có triệu chứng, hoặc HbA1c ≥ 6,5%. Đường huyết đói 140 mg/dL vượt ngưỡng. Sau ăn 140 và HbA1c 4% đều bình thường, đường niệu dương tính không đủ để chẩn đoán."}, {"q": "Bệnh nhân tiêm vaccine COVID-19 lần thứ 4, xuất hiện kháng thể kháng huyết thanh và phản ứng Arthus. Đây là quá mẫn loại nào?", "o": ["Type II", "Type III", "Type I", "Type IV"], "a": 1, "e": "Phản ứng Arthus xuất hiện sau tiêm nhắc lại nhiều lần: kháng thể IgG đã nhiều gặp kháng nguyên tại chỗ, tạo phức hợp miễn dịch lắng đọng thành mạch, hoạt hóa bổ thể và thu hút neutrophil gây viêm hoại tử. Đây là quá mẫn type III (phức hợp miễn dịch)."}, {"q": "Hormone do thận sản xuất kích thích tạo hồng cầu là?", "o": ["Renin", "Aldosterone", "Erythropoietin", "Calcitriol"], "a": 2, "e": "Erythropoietin (EPO) do tế bào kẽ vỏ thận sản xuất khi thiếu O2, kích thích tủy xương tạo hồng cầu."}, {"q": "Một người đàn ông 80 kg, lượng nước trong toàn bộ tế bào là bao nhiêu?", "o": ["32 L", "48 L", "16 L", "4 L"], "a": 0, "e": "Nước toàn cơ thể khoảng 60% cân nặng: 80 kg × 0,6 = 48 L. Trong đó 2/3 là nội bào: 48 × 2/3 = 32 L."}]};

const $=id=>document.getElementById(id);
let state={exam:"1",mode:"practice",retry:false,runs:{},t:0};
let qs=[],ans=[],done=false,run=null;
let dbDoc=null,saveTimer=null,saving=false,dirty=false,dbFailed=false;
const LS="onthi_md_slb_v1";

function key(){return state.exam+"-"+state.mode+(state.retry?"-retry":"")}
function getRun(){
  if(state.retry&&!state.runs[key()])state.retry=false;
  const k=key();
  if(!state.runs[k]){state.runs[k]={order:DATA[state.exam].map((_,i)=>i),ans:{},done:false}}
  return state.runs[k];
}
function setSaved(msg){const s=$("saved");if(s)s.textContent=msg}
function lsRead(){try{const v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function save(){
  state.t=Date.now();lsWrite();dirty=true;
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!dbDoc||dbFailed){setSaved(dbDoc===null?"Đã lưu trên trình duyệt này":"Đã lưu trên trình duyệt này");return}
  if(saving){saveTimer=setTimeout(flush,400);return}
  if(!dirty)return;
  saving=true;dirty=false;
  try{
    await dbDoc.set(JSON.parse(JSON.stringify(state)));
    setSaved("Đã lưu vào tài khoản");
  }catch(e){
    dbFailed=true;setSaved("Đã lưu trên trình duyệt này (chưa lưu được vào tài khoản)");
  }
  saving=false;
  if(dirty)flush();
}
function adopt(s){
  if(!s||typeof s!=="object"||!s.runs)return false;
  state={exam:s.exam==="2"?"2":"1",mode:s.mode==="exam"?"exam":"practice",retry:!!s.retry,runs:s.runs,t:s.t||0};
  return true;
}
function load(){
  run=getRun();
  const D=DATA[state.exam];
  qs=run.order.filter(id=>D[id]).map(id=>({...D[id],id}));
  ans=qs.map(q=>(run.ans[q.id]!==undefined?run.ans[q.id]:-1));
  done=!!run.done;
  $("e1").setAttribute("aria-pressed",state.exam==="1");
  $("e2").setAttribute("aria-pressed",state.exam==="2");
  $("m1").setAttribute("aria-pressed",state.mode==="practice");
  $("m2").setAttribute("aria-pressed",state.mode==="exam");
  $("retrybar").hidden=!state.retry;
  if(state.retry)$("retrytxt").textContent="Đang làm lại "+qs.length+" câu sai";
  render();
}
function render(){
  const mode=state.mode;
  $("hint").textContent=mode==="practice"
    ?"Chọn đáp án để xem đúng/sai ngay. Tiến độ được lưu tự động."
    :"Chọn đáp án cho cả đề, bấm Nộp bài ở cuối trang để xem điểm và đáp án. Tiến độ được lưu tự động.";
  const list=$("list");list.innerHTML="";
  qs.forEach((q,i)=>{
    const d=document.createElement("div");d.className="q";d.id="q"+i;
    const h=document.createElement("h2");
    h.innerHTML='<span class="n">'+(i+1)+'.</span><span></span>';
    h.lastChild.textContent=q.q;d.appendChild(h);
    const o=document.createElement("div");o.className="opts";
    q.o.forEach((t,k)=>{
      const b=document.createElement("button");b.className="opt";b.type="button";
      b.innerHTML='<span class="l">'+L[k]+'</span><span></span>';
      b.lastChild.textContent=t;
      b.onclick=()=>pick(i,k);
      o.appendChild(b);
    });
    d.appendChild(o);
    const n=document.createElement("div");n.className="note";n.hidden=true;d.appendChild(n);
    list.appendChild(d);
  });
  const g=$("grid");g.innerHTML="";
  qs.forEach((q,i)=>{const a=document.createElement("a");a.textContent=i+1;a.id="g"+i;a.href="#q"+i;
    a.onclick=e=>{e.preventDefault();$("q"+i).scrollIntoView({behavior:"smooth"})};g.appendChild(a)});
  $("submit").style.display=mode==="exam"?"":"none";
  update();
  if(done)showResult(false);else $("result").className="result";
}
function pick(i,k){
  const practice=state.mode==="practice";
  if(done||(practice&&ans[i]>=0))return;
  ans[i]=k;run.ans[qs[i].id]=k;save();update();
}
function update(){
  const reveal=done||state.mode==="practice";
  qs.forEach((q,i)=>{
    const d=$("q"+i),bs=d.querySelectorAll(".opt"),n=d.querySelector(".note");
    const shown=done||(reveal&&ans[i]>=0);
    bs.forEach((b,k)=>{
      b.className="opt";
      if(shown){
        if(k===q.a)b.classList.add("ok");
        else if(k===ans[i])b.classList.add("bad");
        b.disabled=true;
      }else{
        if(k===ans[i])b.classList.add("sel");
        b.disabled=false;
      }
    });
    n.hidden=!shown;
    if(shown){
      n.innerHTML=ans[i]===q.a?"<b>Đúng.</b> Đáp án "+L[q.a]+".":(ans[i]<0?"Chưa chọn. ":"Sai. ")+"Đáp án đúng: <b>"+L[q.a]+"</b>.";
      if(q.e){const w=document.createElement("div");w.className="why";w.textContent="Giải thích: "+q.e;n.appendChild(w)}
    }
    const g=$("g"+i);
    g.className=shown?(ans[i]===q.a?"ok":"bad"):(ans[i]>=0?"done":"");
  });
  const c=ans.filter(x=>x>=0).length;
  $("stat").textContent=c+"/"+qs.length;
  $("bar").style.width=(c/qs.length*100)+"%";
}
function showResult(scroll){
  const s=qs.reduce((t,q,i)=>t+(ans[i]===q.a?1:0),0);
  const r=$("result");r.className="result show";
  r.innerHTML="Điểm: <strong>"+s+"/"+qs.length+"</strong> ("+(s/qs.length*10).toFixed(2)+"/10). Câu sai hoặc bỏ trống đã được đánh dấu đỏ.";
  if(scroll)r.scrollIntoView({behavior:"smooth",block:"center"});
}
function submit(){done=true;run.done=true;save();update();showResult(true)}
function setExam(e){state.exam=e;state.retry=false;save();load();window.scrollTo(0,0)}
function setMode(m){state.mode=m;state.retry=false;save();load();window.scrollTo(0,0)}
$("e1").onclick=()=>setExam("1");$("e2").onclick=()=>setExam("2");
$("m1").onclick=()=>setMode("practice");$("m2").onclick=()=>setMode("exam");
$("submit").onclick=submit;
function msg(t){const r=$("result");r.className="result show";r.textContent=t;r.scrollIntoView({behavior:"smooth",block:"center"})}
$("retry").onclick=()=>{
  if(state.mode==="exam"&&!done){msg("Hãy nộp bài trước, sau đó bấm Làm lại câu sai.");return}
  const wrong=qs.filter((q,i)=>ans[i]!==q.a&&(done||ans[i]>=0)).map(q=>q.id);
  if(!wrong.length){msg("Chưa có câu sai nào để làm lại.");return}
  state.retry=true;
  state.runs[key()]={order:wrong,ans:{},done:false};
  save();load();window.scrollTo(0,0);
};
$("back").onclick=()=>{state.retry=false;save();load();window.scrollTo(0,0)};
$("reset").onclick=()=>{delete state.runs[key()];save();load();window.scrollTo(0,0)};
$("shuf").onclick=()=>{
  const o=getRun().order.slice();
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  state.runs[key()]={order:o,ans:{},done:false};save();load();window.scrollTo(0,0);
};
// 1) show the browser copy right away
const local=lsRead();
if(local&&adopt(local))setSaved("Đã khôi phục tiến độ từ trình duyệt này");
load();
// 2) then sync with the account copy when available
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    if(snap.exists){
      const remote=snap.data();
      if(remote&&(remote.t||0)>(state.t||0)&&adopt(remote)){lsWrite();load();setSaved("Đã khôi phục tiến độ từ tài khoản")}
    }
    dbDoc=ref;
    if(dirty||state.t){dirty=true;flush()}
    else setSaved("Tiến độ được lưu vào tài khoản");
  }catch(e){}
})();
</script>

</body></html>
